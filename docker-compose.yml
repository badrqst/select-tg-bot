version: '3.8'

services:
  bot:
    build: .
    container_name: select-tg-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/select.db
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: PostgreSQL database (uncomment if needed)
